name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #second fix: allow Runner to recognize pom.xml file

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache : 'maven'

      - name: Build with Maven
        run: mvn -B package --file pom.xml #first fix: run using pom.xml

